# ===== Quantumult X 远程配置（仅修改订阅 UA 和 MITM 域名） =====
# 说明：本配置仅添加了针对你订阅链接的 User-Agent 伪装重写规则，
#       以及对应的 MITM 域名，不影响你原有的分流、节点等其他设置。

[general]
# 你可以保留自己原有的 general 设置，这里留空避免覆盖。
# 如需合并，请手动复制到你的主配置中。

[rewrite_local]
# 修改订阅请求的 User-Agent，伪装成 iOS Happ 客户端
^https?://vmeow-sproxy-hk-mzksljiegp\.cn-hongkong\.fcapp\.run/.* url request-header (\r\n)User-Agent:.+ (\r\n)User-Agent: Happ/5.6.0/ios/2608171408551$1

[mitm]
# 必须添加订阅域名，否则重写规则无效
enable = true
hostname = vmeow-sproxy-hk-mzksljiegp.cn-hongkong.fcapp.run, *.fcapp.run
