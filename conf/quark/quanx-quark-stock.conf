#!name=夸克-兑换库存重写
#!desc=把 queryPlanList 的档位改成可兑，用于触发 v4/drawCash 抓签名样本
#!author=shishixiu
#
# 用法（Quantumult X）
#   方式一：放到自己的服务器/Gist，作为「远程资源」引用（推荐）
#   方式二：直接把这整段粘进当前配置文件的对应段落
#
# 说明
#   - 只改响应体里的三个字段，不动请求，不影响账号
#   - 改完兑换页所有档位都显示「立即兑换」
#   - 服务端仍会拒绝真实提现（AWARD:LIMIT_RECEIVE / RISK_USER），不扣币
#   - 用完记得关掉，否则兑换页状态是假的

[mitm]
hostname = coral2.quark.cn, coral3.quark.cn

[rewrite_local]

# canDraw: false -> true
^https?:\/\/coral2\.quark\.cn\/quark\/welfare\/v3\/queryPlanList url response-body "canDraw"\s*:\s*false response-body "canDraw":true

# limitCode 一律清空（NOT_ENOUGH / LIMIT_RECEIVE / TASK_NOT_DONE 全干掉）
^https?:\/\/coral2\.quark\.cn\/quark\/welfare\/v3\/queryPlanList url response-body "limitCode"\s*:\s*"[^"]*" response-body "limitCode":""

# assigned 归零（前端有地方拿它算进度）
^https?:\/\/coral2\.quark\.cn\/quark\/welfare\/v3\/queryPlanList url response-body "assigned"\s*:\s*\d+ response-body "assigned":0
